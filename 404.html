<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found | i3X</title>
  <meta name="robots" content="noindex">
  <script>
    // SDK docs and conformance tests moved to their own subdomains --
    // forward deep links like /sdk/quickstart or /conformance/results
    (function () {
      var m = window.location.pathname.match(/^\/(sdk|conformance)(\/.*)?$/);
      if (m) {
        window.location.replace("https://" + m[1] + ".i3x.dev" + (m[2] || "/") + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>Sorry, that page doesn't exist. <a href="/">Return to the i3X home page</a>.</p>
</body>
</html>
